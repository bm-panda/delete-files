[bmscriptsbox]

[bmscriptsbox.info]
id = "7f3c1a92-4b6d-4e15-9c8f-2a6d5e7b1c34"
name = "文件删除助手"
desc = "按条件批量清理文件的 Python 脚本，基于deletor实现，支持扩展名/大小/时间筛选、递归与空目录清理，预览/回收站/永久删除三档，可定时任务并回传删除清单，兼容不忙脚本盒子"
version = "1.0.0"
icon = "icon/logo.png"

[bmscriptsbox.runtime]
language = "python"
language_version = ">=3.8"
entry = "main.py"
terminal = "always"
binaries = [{ name = "deletor" }]

[bmscriptsbox.triggers.context_menu]
enabled = true
targets = ["directory", "background"]

[bmscriptsbox.triggers.shortcut]
enabled = true
input_type = "folders"

[[bmscriptsbox.inputs]]
name = "target_dirs"
label = "目标文件夹"
type = "list"
pick = "folders"
description = "要清理的文件夹绝对路径数组，每个文件夹各调用一次 deletor -d"

[[bmscriptsbox.params]]
name = "safety"
label = "方式"
type = "str"
default = "trash"
choices = ["preview", "trash", "permanent"]
choice_labels = { preview = "仅预览", trash = "送回收站", permanent = "永久删除" }
description = "preview=只列不删；trash=送回收站；permanent=物理删除（不可恢复）"

[[bmscriptsbox.params]]
name = "recursive"
label = "递归子目录"
type = "bool"
default = true
description = "true → deletor -subdirs；false 只处理当前层"

[[bmscriptsbox.params]]
name = "prune_empty"
label = "清理空目录"
type = "bool"
default = false
when = { field = "safety", in = ["trash", "permanent"] }
description = "映射 -prune-empty：deletor 只删文件、绝不删非空目录，本项仅清理删完变空的子目录；deletor 会连被清空的目标文件夹自身一起删除，脚本已在事后原地重建。preview 档隐藏：二次确认无法用管道 stdin 满足，必然 EOF 退出码 1"

[[bmscriptsbox.params]]
name = "extensions"
label = "扩展名"
type = "str"
default = ""
description = "逗号分隔如 log,tmp,bak；留空=不限扩展名"

[[bmscriptsbox.params]]
name = "size_mode"
label = "大小范围"
type = "str"
default = "off"
choices = ["off", "on"]
choice_labels = { off = "不限", on = "限制" }
description = "用 str 开关而非 bool：bool 恒可见，子字段无法折叠隐藏"

[[bmscriptsbox.params]]
name = "min_size"
label = "最小"
type = "str"
default = ""
when = { field = "size_mode", eq = "on" }
description = "格式 10kb / 1mb / 1gb / 10b"

[[bmscriptsbox.params]]
name = "max_size"
label = "最大"
type = "str"
default = ""
when = { field = "size_mode", eq = "on" }
description = "格式同最小"

[[bmscriptsbox.params]]
name = "time_mode"
label = "修改时间"
type = "str"
default = "off"
choices = ["off", "older", "newer", "both"]
choice_labels = { off = "不限", older = "早于", newer = "晚于", both = "区间内" }
description = "off 不传时间条件；older→--older；newer→--newer；both→两个都传"

[[bmscriptsbox.params]]
name = "older"
label = "早于"
type = "str"
default = ""
when = { field = "time_mode", in = ["older", "both"] }
description = "格式 1sec/2min/3hour/4day/5week/6month/7year，如 30day"

[[bmscriptsbox.params]]
name = "newer"
label = "晚于"
type = "str"
default = ""
when = { field = "time_mode", in = ["newer", "both"] }
description = "格式同早于"

[[bmscriptsbox.params]]
name = "exclude"
label = "排除"
type = "str"
default = "Windows,Program Files,Program Files (x86),ProgramData,AppData,boot,Recovery,$Recycle.Bin,System Volume Information,.git,node_modules"
description = "路径子串命中即跳过；默认值是第一层安全防护"

[[bmscriptsbox.params]]
name = "allow_system"
label = "允许系统目录"
type = "bool"
default = false
description = "逃生口：放宽脚本侧对系统目录根的拦截；盘根（如 D:\\）永远拦截、无逃生口"

[[bmscriptsbox.outputs]]
name = "deleted_files"
type = "list"
description = "已删除（preview 档为待删除）文件绝对路径，多文件夹聚合；超过上限截断，精确数量见 total_count"

[[bmscriptsbox.outputs]]
name = "failed_paths"
type = "list"
description = "deletor 报成功但复核后仍存在的路径（trash 失败会被 deletor 静默丢弃，故脚本自行复核）"

[[bmscriptsbox.outputs]]
name = "skipped_dirs"
type = "list"
description = "被安全拦截或不存在而跳过的目标文件夹"

[[bmscriptsbox.outputs]]
name = "total_count"
type = "str"
description = "命中文件数量（整数字符串，精确值）"

[[bmscriptsbox.outputs]]
name = "freed_bytes"
type = "str"
description = "释放字节数（整数字符串；preview 档为待释放预估量，取自 deletor 的表格而非日志）"

[[bmscriptsbox.outputs]]
name = "freed_size"
type = "str"
description = "人类可读大小，如 2.00 MB（preview 档为预估）"

[[bmscriptsbox.outputs]]
name = "safety_mode"
type = "str"
description = "本次实际生效档位 preview/trash/permanent"

[[bmscriptsbox.outputs]]
name = "log_path"
type = "str"
description = "本次 deletor.json 日志所在目录（preview 档无日志为空串）"

[bmscriptsbox.node]
enabled = true

[bmscriptsbox.schedule]
enabled = true

[bmscriptsbox.params_form]
enabled = true
